<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizAnalytic — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { background: #060612; font-family: 'Space Grotesk', sans-serif; }
        body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.07); }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0099bb); transition: all 0.2s ease; }
        .btn-primary:hover { box-shadow: 0 0 28px rgba(0,212,255,0.45); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
        .input-field { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: white; transition: all 0.2s ease; }
        .input-field:focus { outline: none; border-color: rgba(0,212,255,0.4); box-shadow: 0 0 0 3px rgba(0,212,255,0.08); }
        .input-field::placeholder { color: rgba(255,255,255,0.25); }
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .spinner { border: 2px solid rgba(0,212,255,0.1); border-top-color: #00d4ff; border-radius: 50%; width: 16px; height: 16px; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-gray-200 p-4">

    <div class="relative z-10 w-full max-w-sm fade-in">

        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl mx-auto mb-4 flex items-center justify-center" style="background: linear-gradient(135deg, #00d4ff, #0099bb); box-shadow: 0 0 24px rgba(0,212,255,0.3)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 3h2v-2h2v2h2v2h-2v2h-2v-2h-2z"/></svg>
            </div>
            <h1 class="text-xl font-bold text-white">BizAnalytic</h1>
            <p class="text-xs text-gray-500 mt-1 font-mono">AI Platform v1.0</p>
        </div>

        <!-- Card -->
        <div class="glass rounded-2xl p-6" style="border-color: rgba(0,212,255,0.1);">

            <!-- Tab -->
            <div class="flex rounded-xl p-1 mb-6" style="background: rgba(255,255,255,0.04)">
                <button id="tab-login" onclick="switchTab('login')"
                    class="flex-1 py-2 rounded-lg text-sm font-semibold transition-all"
                    style="background: linear-gradient(135deg, #00d4ff, #0099bb); color: #060612">
                    Login
                </button>
                <button id="tab-register" onclick="switchTab('register')"
                    class="flex-1 py-2 rounded-lg text-sm font-semibold text-gray-400 transition-all">
                    Register
                </button>
            </div>

            <!-- Error/Success -->
            <div id="msg" class="hidden rounded-xl p-3 mb-4 text-xs text-center"></div>

            <!-- Form -->
            <div class="space-y-4">
                <div id="name-field" class="hidden">
                    <label class="text-xs text-gray-500 mb-1.5 block">Full Name</label>
                    <input id="name" type="text" placeholder="Nama lengkap"
                        class="input-field w-full px-4 py-3 rounded-xl text-sm" />
                </div>

                <div>
                    <label class="text-xs text-gray-500 mb-1.5 block">Email</label>
                    <input id="email" type="email" placeholder="email@example.com"
                        class="input-field w-full px-4 py-3 rounded-xl text-sm" />
                </div>

                <div>
                    <label class="text-xs text-gray-500 mb-1.5 block">Password</label>
                    <input id="password" type="password" placeholder="••••••••"
                        class="input-field w-full px-4 py-3 rounded-xl text-sm" />
                </div>

                <button id="submit-btn" onclick="handleSubmit()"
                    class="btn-primary w-full py-3 rounded-xl text-sm font-bold flex items-center justify-center gap-2" style="color: #060612">
                    <span id="btn-text">Login</span>
                </button>
            </div>

            <!-- Divider -->
            <div class="flex items-center gap-3 my-5">
                <div class="flex-1 h-px" style="background: rgba(255,255,255,0.07)"></div>
                <span class="text-xs text-gray-600">atau</span>
                <div class="flex-1 h-px" style="background: rgba(255,255,255,0.07)"></div>
            </div>

            <!-- GitHub -->
            <button onclick="loginGithub()"
                class="w-full py-3 rounded-xl text-sm font-semibold text-white flex items-center justify-center gap-2 transition-all hover:bg-white hover:bg-opacity-10"
                style="border: 1px solid rgba(255,255,255,0.12)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                Login dengan GitHub
            </button>
        </div>

        <p class="text-center text-xs text-gray-600 mt-6">BizAnalytic AI Platform · Secure Login</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://xabxhsextubffgukzwmc.supabase.co'
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhYnhoc2V4dHViZmZndWt6d21jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1Mjg1MDMsImV4cCI6MjA5MzEwNDUwM30.Rctq8NuRiblEkycni2AKx0GOaK67XKX0_Kleo563T-w'

        let currentTab = 'login'

        // Check if already logged in
        const session = localStorage.getItem('sb_session')
        if (session) window.location.href = 'index.html'

        function switchTab(tab) {
            currentTab = tab
            const isLogin = tab === 'login'
            document.getElementById('tab-login').style.background = isLogin ? 'linear-gradient(135deg, #00d4ff, #0099bb)' : 'transparent'
            document.getElementById('tab-login').style.color = isLogin ? '#060612' : '#9ca3af'
            document.getElementById('tab-register').style.background = !isLogin ? 'linear-gradient(135deg, #00d4ff, #0099bb)' : 'transparent'
            document.getElementById('tab-register').style.color = !isLogin ? '#060612' : '#9ca3af'
            document.getElementById('name-field').className = isLogin ? 'hidden' : ''
            document.getElementById('btn-text').textContent = isLogin ? 'Login' : 'Register'
            hideMsg()
        }

        function showMsg(text, isError = true) {
            const el = document.getElementById('msg')
            el.textContent = text
            el.className = `rounded-xl p-3 mb-4 text-xs text-center ${isError ? 'text-red-400' : 'text-green-400'}`
            el.style.background = isError ? 'rgba(255,71,87,0.08)' : 'rgba(0,255,136,0.08)'
            el.style.border = isError ? '1px solid rgba(255,71,87,0.2)' : '1px solid rgba(0,255,136,0.2)'
        }

        function hideMsg() {
            document.getElementById('msg').className = 'hidden'
        }

        function setLoading(loading) {
            const btn = document.getElementById('submit-btn')
            const text = document.getElementById('btn-text')
            if (loading) {
                btn.disabled = true
                btn.innerHTML = '<div class="spinner"></div>'
            } else {
                btn.disabled = false
                btn.innerHTML = `<span id="btn-text">${currentTab === 'login' ? 'Login' : 'Register'}</span>`
            }
        }

        async function handleSubmit() {
            const email = document.getElementById('email').value.trim()
            const password = document.getElementById('password').value
            if (!email || !password) return showMsg('Email dan password wajib diisi')

            setLoading(true)
            hideMsg()

            const endpoint = currentTab === 'login'
                ? `${SUPABASE_URL}/auth/v1/token?grant_type=password`
                : `${SUPABASE_URL}/auth/v1/signup`

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
                    body: JSON.stringify({ email, password })
                })
                const data = await res.json()

                if (data.error || data.error_description) {
                    showMsg(data.error_description || data.error)
                } else if (currentTab === 'register') {
                    showMsg('Registrasi berhasil! Cek email untuk verifikasi.', false)
                } else {
                    localStorage.setItem('sb_session', JSON.stringify(data))
                    localStorage.setItem('sb_user', JSON.stringify(data.user))
                    window.location.href = 'index.html'
                }
            } catch(e) {
                showMsg('Koneksi gagal, coba lagi')
            } finally {
                setLoading(false)
            }
        }

        async function loginGithub() {
            const res = await fetch(`${SUPABASE_URL}/auth/v1/authorize?provider=github&redirect_to=${encodeURIComponent(window.location.origin + '/index.html')}`, {
                headers: { 'apikey': SUPABASE_KEY }
            })
            window.location.href = `${SUPABASE_URL}/auth/v1/authorize?provider=github&redirect_to=${encodeURIComponent(window.location.origin + '/index.html')}`
        }

        // Enter key
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') handleSubmit()
        })
    </script>
</body>
</html>
