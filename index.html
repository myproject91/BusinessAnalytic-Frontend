<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizAnalytic - AI Business Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { background: #0b0b1a; font-family: 'Inter', sans-serif; color: #e2e8f0; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.4); border-radius: 4px; }

        .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.06); }
        .glass-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08); transition: all 0.3s ease; }
        .glass-card:hover { border-color: rgba(0, 212, 255, 0.3); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }

        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #0b0b1a; font-weight: 600; transition: all 0.2s ease; }
        .btn-primary:hover { box-shadow: 0 0 30px rgba(0, 212, 255, 0.4); transform: scale(1.02); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        .upload-zone { border: 2px dashed rgba(0, 212, 255, 0.2); transition: all 0.3s ease; }
        .upload-zone:hover, .upload-zone.drag-over { border-color: rgba(0, 212, 255, 0.6); background: rgba(0, 212, 255, 0.05); }

        .sidebar-link { transition: all 0.15s ease; border-left: 3px solid transparent; }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(0, 212, 255, 0.08); border-left-color: #00d4ff; color: #00d4ff; }

        .spinner { border: 2px solid rgba(0, 212, 255, 0.1); border-top-color: #00d4ff; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .kpi-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
        .kpi-card .stat { font-size: 1.75rem; font-weight: 700; }

        .chart-container { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; }
        .section-title { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: #64748b; }

        @media (max-width: 768px) {
            .sidebar-desktop { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar-desktop.open { transform: translateX(0); }
            .mobile-nav { display: flex !important; }
            .kpi-grid { grid-template-columns: repeat(2,1fr) !important; }
            .chart-grid-2 { grid-template-columns: 1fr !important; }
            .insight-grid { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body class="min-h-screen" x-data="app()" x-init="init()">

    <!-- Mobile Sidebar Overlay -->
    <div class="sidebar-overlay fixed inset-0 bg-black/60 z-20 hidden" :class="sidebarOpen ? 'block' : ''" @click="sidebarOpen = false"></div>

    <div class="flex min-h-screen relative z-10">
        <!-- Sidebar -->
        <aside class="sidebar-desktop fixed left-0 top-0 h-full w-64 bg-[#0b0b1a] border-r border-white/5 z-30 flex flex-col"
               :class="sidebarOpen ? 'open' : ''">
            <div class="p-5 border-b border-white/5 flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl btn-primary flex items-center justify-center flex-shrink-0">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 3h2v-2h2v2h2v2h-2v2h-2v-2h-2z"/></svg>
                </div>
                <div>
                    <div class="font-bold text-white tracking-wide">BizAnalytic</div>
                    <div class="text-[10px] text-gray-500 font-mono">AI Platform v2.0</div>
                </div>
            </div>
            <nav class="flex-1 px-3 py-5 space-y-1">
                <p class="section-title px-3 mb-2">Menu</p>
                <button @click="activeSection = 'dashboard'; sidebarOpen = false" :class="activeSection === 'dashboard' ? 'active' : ''" class="sidebar-link w-full text-left px-3 py-2.5 rounded-lg text-sm text-gray-400 flex items-center gap-3">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                    Dashboard
                </button>
                <button @click="activeSection = 'upload'; sidebarOpen = false" :class="activeSection === 'upload' ? 'active' : ''" class="sidebar-link w-full text-left px-3 py-2.5 rounded-lg text-sm text-gray-400 flex items-center gap-3">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                    Upload Data
                </button>
                <button @click="activeSection = 'insight'; sidebarOpen = false" :class="activeSection === 'insight' ? 'active' : ''" class="sidebar-link w-full text-left px-3 py-2.5 rounded-lg text-sm text-gray-400 flex items-center gap-3">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    AI Insight
                </button>
                <button @click="activeSection = 'charts'; sidebarOpen = false" :class="activeSection === 'charts' ? 'active' : ''" class="sidebar-link w-full text-left px-3 py-2.5 rounded-lg text-sm text-gray-400 flex items-center gap-3">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
                    Charts
                </button>
                <button @click="activeSection = 'history'; sidebarOpen = false; loadHistory()" :class="activeSection === 'history' ? 'active' : ''" class="sidebar-link w-full text-left px-3 py-2.5 rounded-lg text-sm text-gray-400 flex items-center gap-3">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                    History
                </button>
            </nav>
            <div class="p-4 border-t border-white/5">
                <div class="glass rounded-xl px-3 py-2.5 flex items-center gap-2.5">
                    <div class="w-2 h-2 rounded-full flex-shrink-0" :class="apiStatus === 'online' ? 'bg-green-400' : 'bg-red-400'"></div>
                    <div>
                        <p class="text-xs font-medium" :class="apiStatus === 'online' ? 'text-green-400' : 'text-red-400'" x-text="apiStatus === 'online' ? 'API Online' : 'API Offline'"></p>
                        <p class="text-[10px] text-gray-600 font-mono">railway.app</p>
                    </div>
                    <button @click="checkApi()" class="ml-auto text-gray-600 hover:text-accent transition-colors">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 md:ml-64 min-h-screen">
            <!-- Header -->
            <header class="sticky top-0 z-10 px-6 py-3.5 flex items-center justify-between bg-[#0b0b1a]/80 backdrop-blur-xl border-b border-white/5">
                <div class="flex items-center gap-3">
                    <button class="md:hidden flex items-center justify-center w-8 h-8 rounded-lg glass text-gray-400 hover:text-accent" @click="sidebarOpen = !sidebarOpen">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </button>
                    <h1 class="text-sm font-bold text-white" x-text="sectionTitle()"></h1>
                </div>
                <div class="flex items-center gap-3">
                    <template x-if="result">
                        <div class="flex gap-2">
                            <button @click="exportPDF()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-red-400 border border-red-400/30 hover:bg-red-400/10 transition-all">PDF</button>
                            <button @click="exportReport()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-accent border border-accent/30 hover:bg-accent/10 transition-all">JSON</button>
                        </div>
                    </template>
                    <button @click="logout()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 border border-white/10 hover:text-red-400 hover:border-red-400/30 transition-all">Logout</button>
                    <div class="w-8 h-8 rounded-lg glass-strong flex items-center justify-center text-xs font-bold text-accent font-mono">AI</div>
                </div>
            </header>

            <!-- Content -->
            <div class="p-6 max-w-7xl mx-auto">
                <!-- Telegram ID Input -->
                <div x-show="activeSection === 'upload' || activeSection === 'dashboard'" class="mb-4">
                    <div class="glass rounded-xl px-4 py-3 flex items-center gap-3">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="#00d4ff"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
                        <input type="text" x-model="telegramId" placeholder="Telegram ID (opsional) — hasil analisis akan dikirim via Telegram"
                               class="flex-1 bg-transparent text-sm text-gray-300 placeholder-gray-600 outline-none" />
                        <span x-show="telegramId" class="text-xs text-green-400">✓</span>
                    </div>
                </div>

                <!-- Upload & Dashboard Section -->
                <div x-show="activeSection === 'upload' || activeSection === 'dashboard'" class="fade-in space-y-4">
                    <div class="upload-zone rounded-2xl p-8 text-center cursor-pointer mb-5"
                         @click="$refs.fileInput.click()"
                         @dragover.prevent="$el.classList.add('drag-over')"
                         @dragleave="$el.classList.remove('drag-over')"
                         @drop.prevent="handleDrop($event)">
                        <input type="file" accept=".csv" x-ref="fileInput" @change="handleFileSelect($event)" class="hidden">
                        <div class="w-12 h-12 rounded-xl btn-primary mx-auto mb-3 flex items-center justify-center shadow-lg shadow-accent/20">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                        </div>
                        <template x-if="!selectedFile">
                            <div>
                                <p class="text-sm font-semibold text-gray-300">Drop CSV file atau tap untuk memilih</p>
                                <p class="text-xs text-gray-600 mt-1">Penjualan · Transaksi · Review · Invoice</p>
                            </div>
                        </template>
                        <template x-if="selectedFile">
                            <div>
                                <p class="text-sm font-bold text-white" x-text="selectedFile.name"></p>
                                <p class="text-xs text-accent mt-1" x-text="formatFileSize(selectedFile.size)"></p>
                            </div>
                        </template>
                    </div>

                    <button @click="analyze()" :disabled="!selectedFile || loading"
                            class="btn-primary w-full py-3.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 mb-5">
                        <template x-if="loading"><div class="spinner"></div></template>
                        <span x-text="loading ? 'Menganalisis...' : 'Jalankan Analisis'"></span>
                    </button>

                    <template x-if="error">
                        <div class="rounded-xl p-4 mb-5 text-sm bg-red-500/10 border border-red-500/20 text-red-400" x-text="error"></div>
                    </template>

                    <!-- Results -->
                    <template x-if="result">
                        <div class="fade-in space-y-6">
                            <p class="section-title text-gray-500">Ringkasan Data</p>
                            <div class="kpi-grid grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div class="kpi-card rounded-xl p-4">
                                    <p class="text-xs text-gray-500 mb-1">Total Baris</p>
                                    <p class="stat text-white" x-text="result.profile.shape.rows.toLocaleString()"></p>
                                    <p class="text-xs text-gray-600 mt-1">records</p>
                                </div>
                                <div class="kpi-card rounded-xl p-4">
                                    <p class="text-xs text-gray-500 mb-1">Kolom</p>
                                    <p class="stat text-white" x-text="result.profile.shape.columns"></p>
                                    <p class="text-xs text-gray-600 mt-1">terdeteksi</p>
                                </div>
                                <div class="kpi-card rounded-xl p-4">
                                    <p class="text-xs text-gray-500 mb-1">Anomali</p>
                                    <p class="stat" :class="Object.keys(result.anomalies).length > 0 ? 'text-red-400' : 'text-green-400'" x-text="Object.keys(result.anomalies).length > 0 ? Object.values(result.anomalies)[0].count : 0"></p>
                                    <p class="text-xs text-gray-600 mt-1">terflag</p>
                                </div>
                                <div class="kpi-card rounded-xl p-4">
                                    <p class="text-xs text-gray-500 mb-1">Sentimen Positif</p>
                                    <p class="stat text-green-400" x-text="result.sentiment.distribution ? result.sentiment.distribution.positive : 'N/A'"></p>
                                    <p class="text-xs text-gray-600 mt-1">dari total</p>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Charts Section -->
                <template x-if="result && (activeSection === 'charts' || activeSection === 'dashboard')">
                    <div class="fade-in space-y-4 mt-6">
                        <p class="section-title text-gray-500">Visualisasi Data</p>
                        <div class="chart-grid-2 grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="chart-container p-4">
                                <p class="text-xs font-semibold text-gray-400 mb-3">Distribusi Rating</p>
                                <div id="chart-rating" style="height: 220px;"></div>
                            </div>
                            <div class="chart-container p-4">
                                <p class="text-xs font-semibold text-gray-400 mb-3">Distribusi Sentimen</p>
                                <div id="chart-sentiment" style="height: 220px;"></div>
                            </div>
                        </div>
                        <div class="chart-container p-4">
                            <p class="text-xs font-semibold text-gray-400 mb-3">Sentimen per Aspek</p>
                            <div id="chart-aspect" style="height: 240px;"></div>
                        </div>
                        <div class="chart-grid-2 grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="chart-container p-4">
                                <p class="text-xs font-semibold text-gray-400 mb-3">3D Scatter</p>
                                <div id="chart-3d" style="height: 280px;"></div>
                            </div>
                            <div class="chart-container p-4">
                                <p class="text-xs font-semibold text-gray-400 mb-3">Surface Plot</p>
                                <div id="chart-surface" style="height: 280px;"></div>
                            </div>
                        </div>
                        <div class="chart-grid-2 grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="chart-container p-4">
                                <p class="text-xs font-semibold text-gray-400 mb-3">Top Keywords</p>
                                <div id="chart-keywords" style="height: 240px;"></div>
                            </div>
                            <div class="chart-container p-4">
                                <p class="text-xs font-semibold text-gray-400 mb-3">Deteksi Anomali</p>
                                <div id="chart-anomaly" style="height: 240px;"></div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- AI Insight Section -->
                <template x-if="result && (activeSection === 'insight' || activeSection === 'dashboard')">
                    <div class="fade-in space-y-4 mt-6">
                        <p class="section-title text-gray-500">Analisis AI</p>
                        <div class="glass rounded-2xl p-6 space-y-6">
                            <div class="flex items-center gap-3 mb-4 pb-4 border-b border-white/5">
                                <div class="w-10 h-10 rounded-xl btn-primary flex items-center justify-center shadow-lg">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                                </div>
                                <div>
                                    <p class="text-sm font-bold text-white">AI Analyst</p>
                                    <p class="text-xs text-gray-500 font-mono">Groq AI · Qwen 27B</p>
                                </div>
                            </div>
                            <div class="insight-grid grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="glass-card rounded-xl p-4">
                                    <p class="section-title text-accent mb-2">Ringkasan</p>
                                    <p class="text-sm text-gray-300 leading-relaxed" x-text="result.insight.summary"></p>
                                </div>
                                <div class="glass-card rounded-xl p-4">
                                    <p class="section-title text-red-400 mb-2">Anomali</p>
                                    <p class="text-sm text-gray-300 leading-relaxed" x-text="result.insight.anomaly_flags"></p>
                                </div>
                                <div class="glass-card rounded-xl p-4">
                                    <p class="section-title text-yellow-400 mb-2">Analisis Sentimen</p>
                                    <p class="text-sm text-gray-300 leading-relaxed" x-text="result.insight.sentiment"></p>
                                </div>
                                <div class="glass-card rounded-xl p-4">
                                    <p class="section-title text-green-400 mb-2">Rekomendasi</p>
                                    <p class="text-sm text-gray-300 leading-relaxed" x-text="result.insight.recommendations"></p>
                                </div>
                            </div>
                            <div class="glass-card rounded-xl p-4">
                                <p class="section-title text-accent mb-2">Strategi Bisnis</p>
                                <p class="text-sm text-gray-300 leading-relaxed" x-text="result.insight.strategy"></p>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- History Section -->
                <template x-if="activeSection === 'history'">
                    <div class="fade-in space-y-4">
                        <div class="flex items-center justify-between">
                            <p class="section-title text-gray-500">Riwayat Analisis</p>
                            <button @click="loadHistory()" class="text-xs text-accent hover:text-accent-dim transition-colors flex items-center gap-1">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                                Refresh
                            </button>
                        </div>
                        <template x-if="historyLoading">
                            <div class="flex justify-center py-10"><div class="spinner"></div></div>
                        </template>
                        <template x-if="!historyLoading && historyList.length === 0">
                            <div class="flex flex-col items-center justify-center py-20 text-center">
                                <div class="w-14 h-14 rounded-2xl glass flex items-center justify-center mb-4 text-gray-600">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                                </div>
                                <p class="text-sm font-semibold text-gray-400">Belum ada history</p>
                                <p class="text-xs text-gray-600 mt-1">Upload CSV dan jalankan analisis pertama</p>
                            </div>
                        </template>
                        <template x-if="!historyLoading && historyList.length > 0">
                            <div class="space-y-3">
                                <template x-for="item in historyList" :key="item.id">
                                    <div class="history-card glass-card rounded-xl p-4 cursor-pointer" @click="loadFromHistory(item)">
                                        <div class="flex items-start justify-between">
                                            <div class="flex-1">
                                                <div class="flex items-center gap-2 mb-1">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="#00d4ff"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>
                                                    <p class="text-sm font-semibold text-white" x-text="item.filename"></p>
                                                </div>
                                                <div class="flex items-center gap-4 text-xs text-gray-500">
                                                    <span x-text="new Date(item.created_at).toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'})"></span>
                                                </div>
                                                <div class="flex items-center gap-3 mt-2">
                                                    <span class="text-xs text-gray-400"><span class="text-white" x-text="item.total_rows"></span> rows</span>
                                                    <span class="text-xs text-gray-400"><span class="text-white" x-text="item.total_columns"></span> cols</span>
                                                    <span class="text-xs" :class="item.anomalies > 0 ? 'text-red-400' : 'text-green-400'"><span x-text="item.anomalies"></span> anomali</span>
                                                    <span class="text-xs text-green-400"><span x-text="item.sentiment_positive"></span> pos</span>
                                                </div>
                                            </div>
                                            <button @click.stop="deleteHistory(item.id)" class="text-gray-600 hover:text-red-400 transition-colors p-1">
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Mobile Bottom Nav -->
            <nav class="mobile-nav fixed bottom-0 left-0 right-0 z-20 px-2 py-2 flex justify-around items-center bg-[#0b0b1a]/95 backdrop-blur-xl border-t border-white/5 md:hidden">
                <button @click="activeSection = 'dashboard'" class="flex flex-col items-center gap-1 px-2 py-1" :class="activeSection === 'dashboard' ? 'text-accent' : 'text-gray-500'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                    <span class="text-[10px]">Dashboard</span>
                </button>
                <button @click="activeSection = 'upload'" class="flex flex-col items-center gap-1 px-2 py-1" :class="activeSection === 'upload' ? 'text-accent' : 'text-gray-500'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                    <span class="text-[10px]">Upload</span>
                </button>
                <button @click="activeSection = 'insight'" class="flex flex-col items-center gap-1 px-2 py-1" :class="activeSection === 'insight' ? 'text-accent' : 'text-gray-500'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    <span class="text-[10px]">Insight</span>
                </button>
                <button @click="activeSection = 'charts'" class="flex flex-col items-center gap-1 px-2 py-1" :class="activeSection === 'charts' ? 'text-accent' : 'text-gray-500'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
                    <span class="text-[10px]">Charts</span>
                </button>
                <button @click="activeSection = 'history'; loadHistory()" class="flex flex-col items-center gap-1 px-2 py-1" :class="activeSection === 'history' ? 'text-accent' : 'text-gray-500'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                    <span class="text-[10px]">History</span>
                </button>
            </nav>
            <div class="h-16 md:hidden"></div>
        </main>
    </div>

    <script>
        const API_BASE = 'https://businessanalytic-production.up.railway.app/api/v1';
        const SUPABASE_URL = 'https://xabxhsextubffgukzwmc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhYnhoc2V4dHViZmZndWt6d21jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1Mjg1MDMsImV4cCI6MjA5MzEwNDUwM30.Rctq8NuRiblEkycni2AKx0GOaK67XKX0_Kleo563T-w';

        function app() {
            return {
                activeSection: 'dashboard',
                selectedFile: null,
                loading: false,
                error: null,
                result: null,
                apiStatus: 'offline',
                sidebarOpen: false,
                telegramId: '',
                historyList: [],
                historyLoading: false,

                async init() {
                    await this.checkApi();
                    setInterval(() => this.checkApi(), 30000);
                },

                async checkApi() {
                    try {
                        const res = await fetch(`${API_BASE}/analyze`, { method: 'GET', signal: AbortSignal.timeout(5000) });
                        this.apiStatus = res.ok ? 'online' : 'offline';
                    } catch { this.apiStatus = 'offline'; }
                },

                sectionTitle() {
                    const map = { dashboard: 'Dashboard', upload: 'Upload Data', insight: 'AI Insight', charts: 'Charts', history: 'History' };
                    return map[this.activeSection] || 'Dashboard';
                },

                handleFileSelect(e) {
                    const file = e.target.files[0];
                    if (file) this.selectedFile = file;
                },

                handleDrop(e) {
                    const file = e.dataTransfer.files[0];
                    if (file && file.name.endsWith('.csv')) this.selectedFile = file;
                },

                formatFileSize(bytes) {
                    if (bytes < 1024) return bytes + ' B';
                    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                    return (bytes / 1048576).toFixed(1) + ' MB';
                },

                async analyze() {
                    if (!this.selectedFile || this.loading) return;
                    this.loading = true;
                    this.error = null;
                    this.result = null;
                    const formData = new FormData();
                    formData.append('file', this.selectedFile);
                    try {
                        const res = await fetch(`${API_BASE}/analyze`, { method: 'POST', body: formData });
                        if (!res.ok) {
                            const err = await res.json();
                            throw new Error(err.detail || 'Analisis gagal');
                        }
                        const text = await res.text();
                        this.result = JSON.parse(text);
                        this.apiStatus = 'online';
                        this.activeSection = 'dashboard';
                        this.$nextTick(() => this.renderCharts());
                        this.saveToSupabase();
                        if (this.telegramId) this.sendTelegram();
                    } catch (e) {
                        this.error = e.message;
                    } finally {
                        this.loading = false;
                    }
                },

                async saveToSupabase() {
                    try {
                        const anomalyCount = Object.keys(this.result.anomalies).length > 0 ? Object.values(this.result.anomalies)[0].count : 0;
                        const sentPos = this.result.sentiment.distribution ? this.result.sentiment.distribution.positive || 0 : 0;
                        await fetch(`${SUPABASE_URL}/rest/v1/analyses`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Prefer': 'return=minimal'
                            },
                            body: JSON.stringify({
                                filename: this.selectedFile.name,
                                total_rows: this.result.profile.shape.rows,
                                total_columns: this.result.profile.shape.columns,
                                anomalies: anomalyCount,
                                sentiment_positive: sentPos,
                                result_json: this.result
                            })
                        });
                    } catch(e) { console.error('Supabase save error:', e); }
                },

                async loadHistory() {
                    this.historyLoading = true;
                    try {
                        const res = await fetch(`${SUPABASE_URL}/rest/v1/analyses?select=id,created_at,filename,total_rows,total_columns,anomalies,sentiment_positive&order=created_at.desc&limit=20`, {
                            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                        });
                        this.historyList = await res.json();
                    } catch(e) { console.error('Load history error:', e); }
                    finally { this.historyLoading = false; }
                },

                async loadFromHistory(item) {
                    try {
                        const res = await fetch(`${SUPABASE_URL}/rest/v1/analyses?id=eq.${item.id}&select=result_json`, {
                            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                        });
                        const data = await res.json();
                        if (data[0]) {
                            this.result = data[0].result_json;
                            this.selectedFile = { name: item.filename, size: 0 };
                            this.activeSection = 'dashboard';
                            this.$nextTick(() => this.renderCharts());
                        }
                    } catch(e) { console.error('Load from history error:', e); }
                },

                async deleteHistory(id) {
                    try {
                        await fetch(`${SUPABASE_URL}/rest/v1/analyses?id=eq.${id}`, {
                            method: 'DELETE',
                            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                        });
                        this.historyList = this.historyList.filter(h => h.id !== id);
                    } catch(e) { console.error('Delete history error:', e); }
                },

                async sendTelegram() {
                    try {
                        const anomalyCount = Object.keys(this.result.anomalies).length > 0 ? Object.values(this.result.anomalies)[0].count : 0;
                        const anomalyPct = anomalyCount > 0 ? ((anomalyCount / this.result.profile.shape.rows) * 100).toFixed(1) : 0;
                        const sentDist = this.result.sentiment.distribution || {};
                        const keywords = this.result.sentiment.top_keywords ? this.result.sentiment.top_keywords.slice(0,5).map(k => k[0]).join(', ') : '-';
                        const msg = `🤖 *BizAnalytic Report*\n\n` +
                            `📁 File: ${this.selectedFile.name}\n` +
                            `📊 Rows: ${this.result.profile.shape.rows.toLocaleString()} | Columns: ${this.result.profile.shape.columns}\n\n` +
                            `${anomalyCount > 0 ? '⚠️' : 'OK'} Anomalies: ${anomalyCount} (${anomalyPct}%)${anomalyCount > 0 ? ' — PERLU PERHATIAN!' : ''}\n` +
                            `Positive: ${sentDist.positive || 0} | Negative: ${sentDist.negative || 0} | Neutral: ${sentDist.neutral || 0}\n\n` +
                            `Keywords: ${keywords}\n\n` +
                            `💡 *Summary:*\n${this.result.insight.summary}\n\n` +
                            `${new Date().toLocaleString('id-ID')}`;
                        await fetch(`${API_BASE}/telegram`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ chat_id: this.telegramId, message: msg })
                        });
                    } catch(e) { console.error('Telegram error:', e); }
                },

                async exportPDF() {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    const filename = this.selectedFile ? this.selectedFile.name : 'analysis';
                    const date = new Date().toLocaleDateString('id-ID');
                    const anomalyCount = Object.keys(this.result.anomalies).length > 0 ? Object.values(this.result.anomalies)[0].count : 0;
                    const sentDist = this.result.sentiment.distribution || {};

                    doc.setFillColor(11, 11, 26);
                    doc.rect(0, 0, 210, 297, 'F');
                    doc.setTextColor(0, 212, 255);
                    doc.setFontSize(20);
                    doc.setFont('helvetica', 'bold');
                    doc.text('BizAnalytic Report', 20, 25);
                    doc.setTextColor(150, 150, 150);
                    doc.setFontSize(10);
                    doc.setFont('helvetica', 'normal');
                    doc.text(`File: ${filename}  |  Date: ${date}`, 20, 35);

                    let y = 50;
                    const sections = [
                        { label: 'SUMMARY', key: 'summary', color: [0, 212, 255] },
                        { label: 'ANOMALY FLAGS', key: 'anomaly_flags', color: [255, 71, 87] },
                        { label: 'SENTIMENT ANALYSIS', key: 'sentiment', color: [255, 165, 2] },
                        { label: 'RECOMMENDATIONS', key: 'recommendations', color: [0, 255, 136] },
                        { label: 'STRATEGY', key: 'strategy', color: [0, 212, 255] }
                    ];
                    for (const s of sections) {
                        if (y > 270) { doc.addPage(); doc.setFillColor(11,11,26); doc.rect(0,0,210,297,'F'); y = 20; }
                        doc.setTextColor(...s.color);
                        doc.setFontSize(11);
                        doc.setFont('helvetica', 'bold');
                        doc.text(s.label, 20, y);
                        y += 8;
                        doc.setTextColor(200, 200, 200);
                        doc.setFontSize(9);
                        doc.setFont('helvetica', 'normal');
                        const lines = doc.splitTextToSize(this.result.insight[s.key] || '-', 170);
                        for (const line of lines) {
                            if (y > 280) { doc.addPage(); doc.setFillColor(11,11,26); doc.rect(0,0,210,297,'F'); y = 20; }
                            doc.text(line, 20, y);
                            y += 6;
                        }
                        y += 8;
                    }
                    doc.save(`bizanalytic-${filename}-${date}.pdf`);
                },

                exportReport() {
                    const blob = new Blob([JSON.stringify(this.result, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = 'analysis-report.json'; a.click();
                    URL.revokeObjectURL(url);
                },

                logout() {
                    localStorage.removeItem("sb_session");
                    localStorage.removeItem("sb_user");
                    window.location.reload();
                },

                renderCharts() {
                    const layout = () => ({
                        paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
                        font: { color: '#9ca3af', size: 10, family: 'Inter' },
                        margin: { t: 10, r: 10, b: 36, l: 36 },
                        xaxis: { gridcolor: 'rgba(255,255,255,0.05)', linecolor: 'rgba(255,255,255,0.1)' },
                        yaxis: { gridcolor: 'rgba(255,255,255,0.05)', linecolor: 'rgba(255,255,255,0.1)' }
                    });
                    const config = { displayModeBar: false, responsive: true };

                    if (this.result.stats && this.result.stats.descriptive) {
                        const cols = Object.keys(this.result.stats.descriptive);
                        if (cols.length > 0) {
                            const stat = this.result.stats.descriptive[cols[0]];
                            Plotly.newPlot('chart-rating', [{
                                x: ['Min','Q1','Median','Q3','Max'],
                                y: [stat.min, stat['25%'], stat['50%'], stat['75%'], stat.max],
                                type: 'bar', marker: { color: ['#ff4757','#ffa502','#00d4ff','#ffa502','#00ff88'], opacity: 0.85 }
                            }], layout(), config);
                        }
                    }

                    if (this.result.sentiment && this.result.sentiment.distribution) {
                        const dist = this.result.sentiment.distribution;
                        const labels = Object.keys(dist), values = Object.values(dist);
                        const colors = { positive: '#00ff88', negative: '#ff4757', neutral: '#ffa502' };
                        Plotly.newPlot('chart-sentiment', [{
                            type: 'pie', hole: 0.6, labels, values,
                            textinfo: 'label+percent', textfont: { size: 10 },
                            marker: { colors: labels.map(l => colors[l] || '#888') }
                        }], { ...layout(), showlegend: true, legend: { font: { color: '#9ca3af', size: 9 } } }, config);
                    }

                    if (this.result.sentiment && this.result.sentiment.aspect_summary) {
                        const aspects = Object.keys(this.result.sentiment.aspect_summary);
                        const pos = aspects.map(a => this.result.sentiment.aspect_summary[a].positive || 0);
                        const neu = aspects.map(a => this.result.sentiment.aspect_summary[a].neutral  || 0);
                        const neg = aspects.map(a => this.result.sentiment.aspect_summary[a].negative || 0);
                        Plotly.newPlot('chart-aspect', [
                            { name: 'Positive', x: aspects, y: pos, type: 'bar', marker: { color: '#00ff88', opacity: 0.85 } },
                            { name: 'Neutral',  x: aspects, y: neu, type: 'bar', marker: { color: '#ffa502', opacity: 0.85 } },
                            { name: 'Negative', x: aspects, y: neg, type: 'bar', marker: { color: '#ff4757', opacity: 0.85 } }
                        ], { ...layout(), barmode: 'group', showlegend: true, legend: { font: { color: '#9ca3af', size: 9 } } }, config);
                    }

                    if (this.result.sentiment && this.result.sentiment.top_keywords) {
                        const kw = this.result.sentiment.top_keywords.slice(0, 12);
                        Plotly.newPlot('chart-keywords', [{
                            x: kw.map(k => k[0]), y: kw.map(k => k[1]), type: 'bar',
                            marker: { color: '#00d4ff', opacity: 0.8 }
                        }], { ...layout(), xaxis: { tickangle: -45 } }, config);
                    }

                    if (Object.keys(this.result.anomalies).length > 0) {
                        const col = Object.keys(this.result.anomalies)[0];
                        const info = this.result.anomalies[col];
                        const aidx = info.records.map(r => r.index);
                        const aval = info.records.map(r => r.value);
                        const allRecords = this.result.sentiment.records || [];
                        const normPoints = allRecords.filter(r => !aidx.includes(r.index));
                        Plotly.newPlot('chart-anomaly', [
                            { x: normPoints.map(r => r.index), y: normPoints.map(r => r.compound), mode: 'markers', name: 'Normal', marker: { color: '#00d4ff', size: 4, opacity: 0.5 } },
                            { x: aidx, y: aval, mode: 'markers', name: 'Anomaly', marker: { color: '#ff4757', size: 8, symbol: 'x' } }
                        ], layout(), config);
                    }

                    const recs3d = (this.result.sentiment && this.result.sentiment.records) ? this.result.sentiment.records : [];
                    if (recs3d.length > 0) {
                        Plotly.newPlot('chart-3d', [{
                            type: 'scatter3d', mode: 'markers',
                            x: recs3d.map(r => r.compound), y: recs3d.map(r => r.pos), z: recs3d.map(r => r.neu),
                            marker: { color: recs3d.map(r => r.compound), colorscale: 'RdYlGn', size: 2, opacity: 0.7, colorbar: { thickness: 8, len: 0.5 } }
                        }], {
                            paper_bgcolor: 'transparent',
                            scene: { bgcolor: 'transparent', xaxis: { gridcolor: 'rgba(255,255,255,0.05)', title: 'Compound' }, yaxis: { gridcolor: 'rgba(255,255,255,0.05)', title: 'Positive' }, zaxis: { gridcolor: 'rgba(255,255,255,0.05)', title: 'Neutral' } },
                            margin: { t: 0, r: 0, b: 0, l: 0 }
                        }, config);

                        const bins = 8, zGrid = [];
                        for (let i = 0; i < bins; i++) {
                            const cMin = -1 + i * (2/bins), cMax = -1 + (i+1) * (2/bins), row = [];
                            for (let j = 0; j < bins; j++) {
                                const pMin = j/bins, pMax = (j+1)/bins;
                                const filtered = recs3d.filter(r => r.compound >= cMin && r.compound < cMax && r.pos >= pMin && r.pos < pMax);
                                row.push(filtered.length > 0 ? filtered.reduce((s,r) => s+r.neu, 0)/filtered.length : null);
                            }
                            zGrid.push(row);
                        }
                        Plotly.newPlot('chart-surface', [{
                            type: 'surface', colorscale: 'Viridis', z: zGrid,
                            contours: { z: { show: true, usecolormap: true, project: { z: true } } }
                        }], {
                            paper_bgcolor: 'transparent',
                            scene: { bgcolor: 'transparent', xaxis: { title: 'Pos Bin', gridcolor: 'rgba(255,255,255,0.05)' }, yaxis: { title: 'Compound Bin', gridcolor: 'rgba(255,255,255,0.05)' }, zaxis: { title: 'Avg Neutral', gridcolor: 'rgba(255,255,255,0.05)' } },
                            margin: { t: 0, r: 0, b: 0, l: 0 }
                        }, config);
                    } else {
                        Plotly.newPlot('chart-3d', [{ type: 'scatter3d', mode: 'markers', x: [1,2,3,4,5], y: [0.2,0.5,0.7,0.8,0.9], z: [100,200,300,400,500], marker: { color: [0.2,0.5,0.7,0.8,0.9], colorscale: 'RdYlGn', size: 4, opacity: 0.8 } }], { paper_bgcolor: 'transparent', scene: { bgcolor: 'transparent' }, margin: { t:0,r:0,b:0,l:0 } }, config);
                        Plotly.newPlot('chart-surface', [{ type: 'surface', colorscale: 'Viridis', z: [[0.1,0.3,0.5],[0.4,0.7,0.8],[0.6,0.8,0.95]] }], { paper_bgcolor: 'transparent', scene: { bgcolor: 'transparent' }, margin: { t:0,r:0,b:0,l:0 } }, config);
                    }
                }
            };
        }
    </script>
</body>
</html>
