<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Intelligence Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        dark: { 900: '#060612', 800: '#0c0c1e', 700: '#121228', 600: '#1a1a35', 500: '#22223f' },
                        accent: { DEFAULT: '#00d4ff', dim: '#0099bb', glow: 'rgba(0,212,255,0.15)' },
                        positive: '#00ff88', negative: '#ff4757', neutral: '#ffa502',
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        body { background: #060612; font-family: 'Space Grotesk', sans-serif; }
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #00d4ff33; border-radius: 2px; }
        body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.07); }
        .glass-strong { background: rgba(0,212,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(0,212,255,0.15); }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0099bb); transition: all 0.2s ease; }
        .btn-primary:hover { box-shadow: 0 0 28px rgba(0,212,255,0.45); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
        .kpi-card { background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.06); transition: all 0.25s ease; position: relative; overflow: hidden; }
        .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(0,212,255,0.4), transparent); }
        .kpi-card:hover { border-color: rgba(0,212,255,0.25); box-shadow: 0 0 24px rgba(0,212,255,0.07); transform: translateY(-2px); }
        .upload-zone { border: 2px dashed rgba(0,212,255,0.2); transition: all 0.2s ease; }
        .upload-zone:hover, .upload-zone.drag-over { border-color: rgba(0,212,255,0.55); background: rgba(0,212,255,0.04); }
        .sidebar-link { transition: all 0.15s ease; border-left: 2px solid transparent; position: relative; }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(0,212,255,0.07); border-left-color: #00d4ff; color: #00d4ff; }
        .sidebar-link.active::after { content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 4px; height: 4px; border-radius: 50%; background: #00d4ff; box-shadow: 0 0 8px #00d4ff; }
        .spinner { border: 2px solid rgba(0,212,255,0.1); border-top-color: #00d4ff; border-radius: 50%; width: 16px; height: 16px; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .chart-container { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 14px; overflow: hidden; }
        .status-dot-online { background: #00ff88; animation: pulse-green 2s infinite; }
        .status-dot-offline { background: #ff4757; }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(0,255,136,0.4); } 70% { box-shadow: 0 0 0 6px rgba(0,255,136,0); } 100% { box-shadow: 0 0 0 0 rgba(0,255,136,0); } }
        .mobile-nav { display: none; }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 25; backdrop-filter: blur(4px); }
        .history-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); transition: all 0.2s ease; }
        .history-card:hover { border-color: rgba(0,212,255,0.2); box-shadow: 0 0 16px rgba(0,212,255,0.05); }
        @media (max-width: 768px) {
            .sidebar-desktop { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar-desktop.open { transform: translateX(0); }
            .sidebar-overlay.open { display: block; }
            .main-content { margin-left: 0 !important; }
            .mobile-nav { display: flex; }
            .header-menu-btn { display: flex !important; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; }
            .chart-grid-2 { grid-template-columns: 1fr !important; }
            .insight-grid { grid-template-columns: 1fr !important; }
            .p-desktop { padding: 1rem !important; }
            .header-px { padding-left: 1rem !important; padding-right: 1rem !important; }
        }
        @media (min-width: 769px) { .header-menu-btn { display: none !important; } }
        .num { font-family: 'JetBrains Mono', monospace; }
        .section-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
    </style>
</head>
<body class="text-gray-200 min-h-screen" x-data="app()">

    <div class="sidebar-overlay" :class="sidebarOpen ? 'open' : ''" @click="sidebarOpen = false"></div>

    <div class="flex min-h-screen relative z-10">

        <aside class="sidebar-desktop w-60 min-h-screen flex flex-col fixed left-0 top-0 z-30"
               :class="sidebarOpen ? 'open' : ''"
               style="background: rgba(8,8,22,0.95); border-right: 1px solid rgba(255,255,255,0.06); backdrop-filter: blur(20px);">
            <div class="px-5 py-5 border-b border-white border-opacity-5">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl btn-primary flex items-center justify-center flex-shrink-0" style="box-shadow: 0 0 16px rgba(0,212,255,0.3)">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 3h2v-2h2v2h2v2h-2v2h-2v-2h-2z"/></svg>
                    </div>
                    <div>
                        <div class="text-sm font-bold text-white tracking-wide">BizAnalytic</div>
                        <div class="text-xs text-gray-500 font-mono">AI Platform v1.0</div>
                    </div>
                </div>
            </div>
            <nav class="flex-1 px-3 py-5 space-y-1">
                <p class="section-label text-gray-600 px-3 mb-3">Navigation</p>
                <button @click="activeSection = 'dashboard'; sidebarOpen = false" :class="activeSection === 'dashboard' ? 'active' : ''" class="sidebar-link w-full text-left px-3 py-2.5 rounded-lg text-sm text-gray-400 flex items-center gap-3">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" class="flex-shrink-0"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                    Dashboard
                </button>
                <button @click="activeSection = 'upload'; sidebarOpen = false" :class="activeSection === 'upload' ? 'active' : ''" class="sidebar-link w-full text-left px-3 py-2.5 rounded-lg text-sm text-gray-400 flex items-center gap-3">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" class="flex-shrink-0"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                    Upload Data
                </button>
                <button @click="activeSection = 'insight'; sidebarOpen = false" :class="activeSection === 'insight' ? 'active' : ''" class="sidebar-link w-full text-left px-3 py-2.5 rounded-lg text-sm text-gray-400 flex items-center gap-3">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" class="flex-shrink-0"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    AI Insight
                </button>
                <button @click="activeSection = 'charts'; sidebarOpen = false" :class="activeSection === 'charts' ? 'active' : ''" class="sidebar-link w-full text-left px-3 py-2.5 rounded-lg text-sm text-gray-400 flex items-center gap-3">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" class="flex-shrink-0"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
                    Charts
                </button>
                <button @click="activeSection = 'history'; sidebarOpen = false; loadHistory()" :class="activeSection === 'history' ? 'active' : ''" class="sidebar-link w-full text-left px-3 py-2.5 rounded-lg text-sm text-gray-400 flex items-center gap-3">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" class="flex-shrink-0"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                    History
                </button>
            </nav>
            <div class="px-4 py-4 border-t border-white border-opacity-5">
                <div class="glass rounded-xl px-3 py-2.5 flex items-center gap-2.5">
                    <div class="w-2 h-2 rounded-full flex-shrink-0" :class="apiStatus === 'online' ? 'status-dot-online' : 'status-dot-offline'"></div>
                    <div>
                        <p class="text-xs font-medium" :class="apiStatus === 'online' ? 'text-green-400' : 'text-red-400'" x-text="apiStatus === 'online' ? 'API Online' : 'API Offline'"></p>
                        <p class="text-xs text-gray-600 font-mono">railway.app</p>
                    </div>
                    <button @click="checkApi()" class="ml-auto text-gray-600 hover:text-accent transition-colors">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    </button>
                </div>
            </div>
        </aside>

        <main class="main-content flex-1 md:ml-60 min-h-screen">
            <header class="sticky top-0 z-10 header-px px-6 py-3.5 flex items-center justify-between"
                    style="background: rgba(6,6,18,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05);">
                <button class="header-menu-btn flex items-center justify-center w-8 h-8 rounded-lg glass text-gray-400 hover:text-accent transition-colors mr-3" @click="sidebarOpen = !sidebarOpen">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
                <div class="flex-1">
                    <div class="flex items-center gap-2">
                        <h1 class="text-sm font-bold text-white" x-text="sectionTitle()"></h1>
                        <span class="hidden sm:inline text-xs text-gray-600">·</span>
                        <p class="hidden sm:inline text-xs text-gray-500">AI-powered business intelligence</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <template x-if="result">
                        <div class="flex gap-2">
                            <button @click="exportPDF()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-red-400 border border-red-400 border-opacity-30 hover:bg-red-400 hover:bg-opacity-10 transition-all flex items-center gap-1.5">
                                <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z"/></svg>
                                <span class="hidden sm:inline">PDF</span>
                            </button>
                            <button @click="exportReport()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-accent border border-accent border-opacity-30 hover:bg-accent hover:bg-opacity-10 transition-all flex items-center gap-1.5">
                                <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                                <span class="hidden sm:inline">JSON</span>
                            </button>
                        </div>
                    </template>
                    <div class="w-8 h-8 rounded-lg glass-strong flex items-center justify-center text-xs font-bold text-accent font-mono">AI</div>
                </div>
            </header>

            <div class="p-desktop p-6">

                <!-- Telegram ID Input -->
                <div x-show="activeSection === 'upload' || activeSection === 'dashboard'" class="mb-4">
                    <div class="glass rounded-xl px-4 py-3 flex items-center gap-3">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="#00d4ff"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
                        <input type="text" x-model="telegramId" placeholder="Telegram ID (opsional) — hasil analisis akan dikirim ke Telegram"
                               class="flex-1 bg-transparent text-xs text-gray-300 placeholder-gray-600 outline-none" />
                        <span x-show="telegramId" class="text-xs text-green-400">✓</span>
                    </div>
                </div>

                <!-- Upload Section -->
                <div x-show="activeSection === 'upload' || activeSection === 'dashboard'" class="fade-in">
                    <div class="upload-zone rounded-2xl p-8 text-center cursor-pointer mb-5"
                         @click="$refs.fileInput.click()"
                         @dragover.prevent="$el.classList.add('drag-over')"
                         @dragleave="$el.classList.remove('drag-over')"
                         @drop.prevent="handleDrop($event)">
                        <input type="file" accept=".csv" x-ref="fileInput" @change="handleFileSelect($event)" class="hidden">
                        <div class="w-12 h-12 rounded-xl btn-primary mx-auto mb-3 flex items-center justify-center" style="box-shadow: 0 0 20px rgba(0,212,255,0.3)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                        </div>
                        <template x-if="!selectedFile">
                            <div>
                                <p class="text-sm font-semibold text-gray-300">Drop CSV file or tap to browse</p>
                                <p class="text-xs text-gray-600 mt-1">Sales · Transactions · Reviews · Invoices</p>
                            </div>
                        </template>
                        <template x-if="selectedFile">
                            <div>
                                <p class="text-sm font-bold text-white" x-text="selectedFile.name"></p>
                                <p class="text-xs text-accent mt-1 num" x-text="formatFileSize(selectedFile.size)"></p>
                            </div>
                        </template>
                    </div>

                    <button @click="analyze()" :disabled="!selectedFile || loading"
                            class="btn-primary w-full py-3 rounded-xl text-sm font-bold flex items-center justify-center gap-2 mb-5" style="color: #060612">
                        <template x-if="loading"><div class="spinner"></div></template>
                        <span x-text="loading ? 'Analyzing...' : 'Run Analysis'"></span>
                    </button>

                    <template x-if="error">
                        <div class="rounded-xl p-4 mb-5 text-sm" style="background: rgba(255,71,87,0.08); border: 1px solid rgba(255,71,87,0.2); color: #ff4757;" x-text="error"></div>
                    </template>

                    <template x-if="result">
                        <div class="fade-in">
                            <p class="section-label text-gray-600 mb-3">Overview</p>
                            <div class="kpi-grid grid grid-cols-4 gap-3 mb-6">
                                <div class="kpi-card rounded-xl p-4">
                                    <p class="text-xs text-gray-500 mb-1">Total Rows</p>
                                    <p class="text-xl font-bold text-white num" x-text="result.profile.shape.rows.toLocaleString()"></p>
                                    <p class="text-xs text-gray-600 mt-1">records</p>
                                </div>
                                <div class="kpi-card rounded-xl p-4">
                                    <p class="text-xs text-gray-500 mb-1">Columns</p>
                                    <p class="text-xl font-bold text-white num" x-text="result.profile.shape.columns"></p>
                                    <p class="text-xs text-gray-600 mt-1">detected</p>
                                </div>
                                <div class="kpi-card rounded-xl p-4">
                                    <p class="text-xs text-gray-500 mb-1">Anomalies</p>
                                    <p class="text-xl font-bold num" :class="Object.keys(result.anomalies).length > 0 ? 'text-red-400' : 'text-green-400'" x-text="Object.keys(result.anomalies).length > 0 ? Object.values(result.anomalies)[0].count : 0"></p>
                                    <p class="text-xs text-gray-600 mt-1">flagged</p>
                                </div>
                                <div class="kpi-card rounded-xl p-4">
                                    <p class="text-xs text-gray-500 mb-1">Sentiment</p>
                                    <p class="text-xl font-bold text-green-400 num" x-text="result.sentiment.distribution ? result.sentiment.distribution.positive : 'N/A'"></p>
                                    <p class="text-xs text-gray-600 mt-1">positive</p>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Charts Section -->
                <template x-if="result && (activeSection === 'charts' || activeSection === 'dashboard')">
                    <div class="fade-in space-y-4">
                        <p class="section-label text-gray-600">Visualizations</p>
                        <div class="chart-grid-2 grid grid-cols-2 gap-4">
                            <div class="chart-container p-4">
                                <p class="text-xs font-semibold text-gray-400 mb-3">Rating Distribution</p>
                                <div id="chart-rating" style="height: 220px;"></div>
                            </div>
                            <div class="chart-container p-4">
                                <p class="text-xs font-semibold text-gray-400 mb-3">Sentiment Distribution</p>
                                <div id="chart-sentiment" style="height: 220px;"></div>
                            </div>
                        </div>
                        <div class="chart-container p-4">
                            <p class="text-xs font-semibold text-gray-400 mb-3">Sentiment per Aspect</p>
                            <div id="chart-aspect" style="height: 240px;"></div>
                        </div>
                        <div class="chart-grid-2 grid grid-cols-2 gap-4">
                            <div class="chart-container p-4">
                                <p class="text-xs font-semibold text-gray-400 mb-3">3D Scatter</p>
                                <div id="chart-3d" style="height: 280px;"></div>
                            </div>
                            <div class="chart-container p-4">
                                <p class="text-xs font-semibold text-gray-400 mb-3">Surface Plot</p>
                                <div id="chart-surface" style="height: 280px;"></div>
                            </div>
                        </div>
                        <div class="chart-grid-2 grid grid-cols-2 gap-4">
                            <div class="chart-container p-4">
                                <p class="text-xs font-semibold text-gray-400 mb-3">Top Keywords</p>
                                <div id="chart-keywords" style="height: 240px;"></div>
                            </div>
                            <div class="chart-container p-4">
                                <p class="text-xs font-semibold text-gray-400 mb-3">Anomaly Detection</p>
                                <div id="chart-anomaly" style="height: 240px;"></div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- AI Insight Section -->
                <template x-if="result && (activeSection === 'insight' || activeSection === 'dashboard')">
                    <div class="fade-in space-y-4 mt-4">
                        <p class="section-label text-gray-600">AI Analysis</p>
                        <div class="glass rounded-2xl p-5" style="border-color: rgba(0,212,255,0.12); box-shadow: 0 0 30px rgba(0,212,255,0.05)">
                            <div class="flex items-center gap-3 mb-5 pb-4 border-b border-white border-opacity-5">
                                <div class="w-9 h-9 rounded-xl btn-primary flex items-center justify-center flex-shrink-0" style="box-shadow: 0 0 14px rgba(0,212,255,0.3)">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                                </div>
                                <div>
                                    <p class="text-sm font-bold text-white">AI Analyst</p>
                                    <p class="text-xs text-gray-500 font-mono">AI Engine</p>
                                </div>
                            </div>
                            <div class="insight-grid grid grid-cols-2 gap-4">
                                <div class="glass rounded-xl p-4">
                                    <p class="section-label text-accent mb-3">Summary</p>
                                    <p class="text-sm text-gray-300 leading-relaxed" x-text="result.insight.summary"></p>
                                </div>
                                <div class="glass rounded-xl p-4">
                                    <p class="section-label text-red-400 mb-3">Anomaly Flags</p>
                                    <p class="text-sm text-gray-300 leading-relaxed" x-text="result.insight.anomaly_flags"></p>
                                </div>
                                <div class="glass rounded-xl p-4">
                                    <p class="section-label text-yellow-400 mb-3">Sentiment Analysis</p>
                                    <p class="text-sm text-gray-300 leading-relaxed" x-text="result.insight.sentiment"></p>
                                </div>
                                <div class="glass rounded-xl p-4">
                                    <p class="section-label text-green-400 mb-3">Recommendations</p>
                                    <p class="text-sm text-gray-300 leading-relaxed" x-text="result.insight.recommendations"></p>
                                </div>
                            </div>
                            <div class="glass rounded-xl p-4 mt-4">
                                <p class="section-label text-accent mb-3">Strategy</p>

                        <template x-if="!historyLoading && historyList.length > 0">

                                        <div class="flex items-start justify-between gap-3">

                                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="#00d4ff"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>

                                                <div class="flex items-center gap-3 mt-2">

                    <div class="fade-in flex flex-col items-center justify-center py-20 text-center">
                        <div class="w-14 h-14 rounded-2xl glass flex items-center justify-center mb-4 text-gray-600">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>

                 style="background: rgba(8,8,22,0.95); border-top: 1px solid rgba(255,255,255,0.06); backdrop-filter: blur(20px);">

                    <span class="text-xs">Dashboard</span>

                <button @click="activeSection = 'upload'" class="flex flex-col items-center gap-1 px-2 py-1" :class="activeSection === 'upload' ? 'text-accent' : 'text-gray-500'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                    <span class="text-xs">Upload</span>
                </button>
                <button @click="activeSection = 'insight'" class="flex flex-col items-center gap-1 px-2 py-1" :class="activeSection === 'insight' ? 'text-accent' : 'text-gray-500'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    <span class="text-xs">Insight</span>
                </button>
                <button @click="activeSection = 'charts'" class="flex flex-col items-center gap-1 px-2 py-1" :class="activeSection === 'charts' ? 'text-accent' : 'text-gray-500'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
                    <span class="text-xs">Charts</span>

                <button @click="activeSection = 'history'; loadHistory()" class="flex flex-col items-center gap-1 px-2 py-1" :class="activeSection === 'history' ? 'text-accent' : 'text-gray-500'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                    <span class="text-xs">History</span>

    <script>
        const API_BASE = 'https://businessanalytic.up.railway.app/api/v1'
        const SUPABASE_URL = 'https://xabxhsextubffgukzwmc.supabase.co'
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhYnhoc2V4dHViZmZndWt6d21jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1Mjg1MDMsImV4cCI6MjA5MzEwNDUwM30.Rctq8NuRiblEkycni2AKx0GOaK67XKX0_Kleo563T-w'

        function app() {
            return {
                activeSection : 'dashboard',
                selectedFile  : null,
                loading       : false,
                error         : null,
                result        : null,
                apiStatus     : 'offline',
                sidebarOpen   : false,
                telegramId    : '',
                historyList   : [],
                historyLoading: false,

                async init() {
                    await this.checkApi()
                    setInterval(() => this.checkApi(), 30000)
                },

                async checkApi() {
                    try {
                        const res = await fetch('https://businessanalytic.up.railway.app/', {
                            method: 'GET', signal: AbortSignal.timeout(5000)
                        })
                        this.apiStatus = res.ok ? 'online' : 'offline'
                    } catch { this.apiStatus = 'offline' }
                },

                sectionTitle() {
                    const map = { dashboard: 'Dashboard', upload: 'Upload Data', insight: 'AI Insight', charts: 'Charts', history: 'History' }
                    return map[this.activeSection] || 'Dashboard'
                },

                handleFileSelect(e) {
                    const file = e.target.files[0]
                    if (file) this.selectedFile = file
                },

                handleDrop(e) {
                    const file = e.dataTransfer.files[0]
                    if (file && file.name.endsWith('.csv')) this.selectedFile = file
                },

                formatFileSize(bytes) {
                    if (bytes < 1024) return bytes + ' B'
                    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB'
                    return (bytes / 1048576).toFixed(1) + ' MB'
                },

                async analyze() {
                    if (!this.selectedFile || this.loading) return
                    this.loading = true
                    this.error   = null
                    this.result  = null
                    const formData = new FormData()
                    formData.append('file', this.selectedFile)
                    try {
                        const res = await fetch(`${API_BASE}/analyze`, { method: 'POST', body: formData })
                        if (!res.ok) {
                            const err = await res.json()
                            throw new Error(err.detail || 'Analysis failed')
                        }
                        this.result = await res.json()
                        this.apiStatus = 'online'
                        this.activeSection = 'dashboard'
                        this.$nextTick(() => this.renderCharts())

                        // Auto-save & Telegram (parallel)
                        this.saveToSupabase()
                        if (this.telegramId) this.sendTelegram()

                    } catch (e) {
                        this.error = e.message
                    } finally {
                        this.loading = false
                    }
                },

                async saveToSupabase() {
                    try {
                        const anomalyCount = Object.keys(this.result.anomalies).length > 0
                            ? Object.values(this.result.anomalies)[0].count : 0
                        const sentPos = this.result.sentiment.distribution
                            ? this.result.sentiment.distribution.positive || 0 : 0

                        await fetch(`${SUPABASE_URL}/rest/v1/analyses`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Prefer': 'return=minimal'
                            },
                            body: JSON.stringify({
                                filename: this.selectedFile.name,
                                total_rows: this.result.profile.shape.rows,
                                total_columns: this.result.profile.shape.columns,
                                anomalies: anomalyCount,
                                sentiment_positive: sentPos,
                                result_json: this.result
                            })
                        })
                    } catch(e) { console.error('Supabase save error:', e) }
                },

                async loadHistory() {
                    this.historyLoading = true
                    try {
                        const res = await fetch(`${SUPABASE_URL}/rest/v1/analyses?select=id,created_at,filename,total_rows,total_columns,anomalies,sentiment_positive&order=created_at.desc&limit=20`, {
                            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                        })
                        this.historyList = await res.json()
                    } catch(e) { console.error('Load history error:', e) }
                    finally { this.historyLoading = false }
                },

                async loadFromHistory(item) {
                    try {
                        const res = await fetch(`${SUPABASE_URL}/rest/v1/analyses?id=eq.${item.id}&select=result_json`, {
                            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                        })
                        const data = await res.json()
                        if (data[0]) {
                            this.result = data[0].result_json
                            this.selectedFile = { name: item.filename, size: 0 }
                            this.activeSection = 'dashboard'
                            this.$nextTick(() => this.renderCharts())
                        }
                    } catch(e) { console.error('Load from history error:', e) }
                },

                async deleteHistory(id) {
                    try {
                        await fetch(`${SUPABASE_URL}/rest/v1/analyses?id=eq.${id}`, {
                            method: 'DELETE',
                            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                        })
                        this.historyList = this.historyList.filter(h => h.id !== id)
                    } catch(e) { console.error('Delete history error:', e) }
                },

                async sendTelegram() {
                    try {
                        const anomalyCount = Object.keys(this.result.anomalies).length > 0
                            ? Object.values(this.result.anomalies)[0].count : 0
                        const anomalyPct = anomalyCount > 0
                            ? ((anomalyCount / this.result.profile.shape.rows) * 100).toFixed(1) : 0
                        const sentDist = this.result.sentiment.distribution || {}
                        const keywords = this.result.sentiment.top_keywords
                            ? this.result.sentiment.top_keywords.slice(0,5).map(k => k[0]).join(', ') : '-'

                        const msg = `🤖 *BizAnalytic Report*\n\n` +
                            `📁 File: ${this.selectedFile.name}\n` +
                            `📊 Total Rows: ${this.result.profile.shape.rows.toLocaleString()}\n` +
                            `📋 Columns: ${this.result.profile.shape.columns}\n\n` +
                            `${anomalyCount > 0 ? '⚠️' : '✅'} Anomalies: ${anomalyCount} (${anomalyPct}%)${anomalyCount > 0 ? ' — PERLU PERHATIAN!' : ''}\n` +
                            `💚 Positive: ${sentDist.positive || 0}\n` +
                            `❤️ Negative: ${sentDist.negative || 0}\n` +
                            `💛 Neutral: ${sentDist.neutral || 0}\n\n` +
                            `🔑 Keywords: ${keywords}\n\n` +
                            `💡 *Summary:*\n${this.result.insight.summary}\n\n` +
                            `📅 ${new Date().toLocaleString('id-ID')}`

                        await fetch(`${API_BASE}/telegram`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ chat_id: this.telegramId, message: msg })
                        })
                    } catch(e) { console.error('Telegram error:', e) }
                },

                async exportPDF() {
                    const { jsPDF } = window.jspdf
                    const doc = new jsPDF()
                    const filename = this.selectedFile ? this.selectedFile.name : 'analysis'
                    const date = new Date().toLocaleDateString('id-ID')
                    const anomalyCount = Object.keys(this.result.anomalies).length > 0
                        ? Object.values(this.result.anomalies)[0].count : 0
                    const sentDist = this.result.sentiment.distribution || {}

                    // Header
                    doc.setFillColor(6, 6, 18)
                    doc.rect(0, 0, 210, 297, 'F')
                    doc.setTextColor(0, 212, 255)
                    doc.setFontSize(20)
                    doc.setFont('helvetica', 'bold')
                    doc.text('BizAnalytic Report', 20, 25)
                    doc.setTextColor(150, 150, 150)
                    doc.setFontSize(10)
                    doc.setFont('helvetica', 'normal')
                    doc.text(`File: ${filename}  |  Date: ${date}`, 20, 35)

                    // KPI
                    doc.setTextColor(0, 212, 255)
                    doc.setFontSize(12)
                    doc.setFont('helvetica', 'bold')
                    doc.text('OVERVIEW', 20, 50)
                    doc.setTextColor(255, 255, 255)
                    doc.setFontSize(10)
                    doc.setFont('helvetica', 'normal')
                    doc.text(`Total Rows: ${this.result.profile.shape.rows.toLocaleString()}`, 20, 60)
                    doc.text(`Columns: ${this.result.profile.shape.columns}`, 20, 68)
                    doc.text(`Anomalies: ${anomalyCount}`, 20, 76)
                    doc.text(`Sentiment Positive: ${sentDist.positive || 'N/A'}`, 20, 84)

                    // Insight sections
                    let y = 100
                    const sections = [
                        { label: 'SUMMARY', key: 'summary', color: [0, 212, 255] },
                        { label: 'ANOMALY FLAGS', key: 'anomaly_flags', color: [255, 71, 87] },
                        { label: 'SENTIMENT ANALYSIS', key: 'sentiment', color: [255, 165, 2] },
                        { label: 'RECOMMENDATIONS', key: 'recommendations', color: [0, 255, 136] },
                        { label: 'STRATEGY', key: 'strategy', color: [0, 212, 255] },
                    ]

                    for (const s of sections) {
                        if (y > 260) { doc.addPage(); doc.setFillColor(6,6,18); doc.rect(0,0,210,297,'F'); y = 20 }
                        doc.setTextColor(...s.color)
                        doc.setFontSize(11)
                        doc.setFont('helvetica', 'bold')
                        doc.text(s.label, 20, y)
                        y += 8
                        doc.setTextColor(200, 200, 200)
                        doc.setFontSize(9)
                        doc.setFont('helvetica', 'normal')
                        const lines = doc.splitTextToSize(this.result.insight[s.key] || '-', 170)
                        for (const line of lines) {
                            if (y > 280) { doc.addPage(); doc.setFillColor(6,6,18); doc.rect(0,0,210,297,'F'); y = 20 }
                            doc.text(line, 20, y)
                            y += 6
                        }
                        y += 8
                    }

                    doc.save(`bizanalytic-${filename}-${date}.pdf`)
                },

                renderCharts() {
                    const layout = () => ({
                        paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
                        font: { color: '#9ca3af', size: 10, family: 'Space Grotesk' },
                        margin: { t: 10, r: 10, b: 36, l: 36 }, showlegend: false,
                        xaxis: { gridcolor: '#ffffff08', linecolor: '#ffffff10', tickfont: { size: 9 } },
                        yaxis: { gridcolor: '#ffffff08', linecolor: '#ffffff10', tickfont: { size: 9 } },
                    })
                    const config = { displayModeBar: false, responsive: true }

                    if (this.result.stats && this.result.stats.descriptive) {
                        const numStats = this.result.stats.descriptive
                        const cols = Object.keys(numStats)
                        if (cols.length > 0) {
                            const col = cols[0], stat = numStats[col]
                            Plotly.newPlot('chart-rating', [{
                                x: ['Min','Q1','Median','Q3','Max'],
                                y: [stat.min, stat['25%'], stat['50%'], stat['75%'], stat.max],
                                type: 'bar', marker: { color: ['#ff4757','#ffa502','#00d4ff','#ffa502','#00ff88'], opacity: 0.85 }
                            }], layout(), config)
                        }
                    }

                    if (this.result.sentiment && this.result.sentiment.distribution) {
                        const dist = this.result.sentiment.distribution
                        const labels = Object.keys(dist), values = Object.values(dist)
                        const colors = { positive: '#00ff88', negative: '#ff4757', neutral: '#ffa502' }
                        Plotly.newPlot('chart-sentiment', [{
                            type: 'pie', hole: 0.62, labels, values,
                            textinfo: 'label+percent', textfont: { size: 10 },
                            marker: { colors: labels.map(l => colors[l] || '#888') }
                        }], { ...layout(), showlegend: true, legend: { font: { color: '#9ca3af', size: 9 } } }, config)
                    }

                    if (this.result.sentiment && this.result.sentiment.aspect_summary) {
                        const aspects = Object.keys(this.result.sentiment.aspect_summary)
                        const pos = aspects.map(a => this.result.sentiment.aspect_summary[a].positive || 0)
                        const neu = aspects.map(a => this.result.sentiment.aspect_summary[a].neutral  || 0)
                        const neg = aspects.map(a => this.result.sentiment.aspect_summary[a].negative || 0)
                        Plotly.newPlot('chart-aspect', [
                            { name: 'Positive', x: aspects, y: pos, type: 'bar', marker: { color: '#00ff88', opacity: 0.85 } },
                            { name: 'Neutral',  x: aspects, y: neu, type: 'bar', marker: { color: '#ffa502', opacity: 0.85 } },
                            { name: 'Negative', x: aspects, y: neg, type: 'bar', marker: { color: '#ff4757', opacity: 0.85 } },
                        ], { ...layout(), barmode: 'group', showlegend: true, legend: { font: { color: '#9ca3af', size: 9 } } }, config)
                    }

                    if (this.result.sentiment && this.result.sentiment.top_keywords) {
                        const kw = this.result.sentiment.top_keywords.slice(0, 12)
                        Plotly.newPlot('chart-keywords', [{
                            x: kw.map(k => k[0]), y: kw.map(k => k[1]), type: 'bar',
                            marker: { color: '#00d4ff', opacity: 0.8 }
                        }], { ...layout(), xaxis: { tickangle: -45, gridcolor: '#ffffff08', tickfont: { size: 9 } } }, config)
                    }

                    if (Object.keys(this.result.anomalies).length > 0) {
                        const col  = Object.keys(this.result.anomalies)[0]
                        const info = this.result.anomalies[col]
                        const aidx = info.records.map(r => r.index)
                        const aval = info.records.map(r => r.value)
                        const allRecords = this.result.sentiment.records || []
                        const normPoints = allRecords.filter(r => !aidx.includes(r.index))
                        Plotly.newPlot('chart-anomaly', [
                            { x: normPoints.map(r => r.index), y: normPoints.map(r => r.compound), mode: 'markers', name: 'Normal', marker: { color: '#00d4ff', size: 3, opacity: 0.4 } },
                            { x: aidx, y: aval, mode: 'markers', name: 'Anomaly', marker: { color: '#ff4757', size: 8, symbol: 'x' } }
                        ], layout(), config)
                    }

                    const recs3d = (this.result.sentiment && this.result.sentiment.records) ? this.result.sentiment.records : []
                    if (recs3d.length > 0) {
                        Plotly.newPlot('chart-3d', [{
                            type: 'scatter3d', mode: 'markers',
                            x: recs3d.map(r => r.compound), y: recs3d.map(r => r.pos), z: recs3d.map(r => r.neu),
                            marker: { color: recs3d.map(r => r.compound), colorscale: 'RdYlGn', size: 2, opacity: 0.7, colorbar: { thickness: 8, len: 0.5 } }
                        }], {
                            paper_bgcolor: 'transparent',
                            scene: { bgcolor: 'transparent', xaxis: { gridcolor: '#ffffff10', title: { text: 'Compound', font: { size: 9, color: '#9ca3af' } } }, yaxis: { gridcolor: '#ffffff10', title: { text: 'Positive', font: { size: 9, color: '#9ca3af' } } }, zaxis: { gridcolor: '#ffffff10', title: { text: 'Neutral', font: { size: 9, color: '#9ca3af' } } } },
                            margin: { t: 0, r: 0, b: 0, l: 0 }, font: { color: '#9ca3af', size: 9 }
                        }, config)

                        const bins = 8, zGrid = []
                        for (let i = 0; i < bins; i++) {
                            const cMin = -1 + i * (2/bins), cMax = -1 + (i+1) * (2/bins), row = []
                            for (let j = 0; j < bins; j++) {
                                const pMin = j/bins, pMax = (j+1)/bins
                                const filtered = recs3d.filter(r => r.compound >= cMin && r.compound < cMax && r.pos >= pMin && r.pos < pMax)
                                row.push(filtered.length > 0 ? filtered.reduce((s,r) => s+r.neu, 0)/filtered.length : null)
                            }
                            zGrid.push(row)
                        }
                        Plotly.newPlot('chart-surface', [{
                            type: 'surface', colorscale: 'Viridis', z: zGrid,
                            contours: { z: { show: true, usecolormap: true, highlightcolor: '#00d4ff', project: { z: true } } }
                        }], {
                            paper_bgcolor: 'transparent',
                            scene: { bgcolor: 'transparent', xaxis: { gridcolor: '#ffffff10', title: { text: 'Pos Bin', font: { size: 9, color: '#9ca3af' } } }, yaxis: { gridcolor: '#ffffff10', title: { text: 'Compound Bin', font: { size: 9, color: '#9ca3af' } } }, zaxis: { gridcolor: '#ffffff10', title: { text: 'Avg Neutral', font: { size: 9, color: '#9ca3af' } } } },
                            margin: { t: 0, r: 0, b: 0, l: 0 }, font: { color: '#9ca3af', size: 9 }
                        }, config)
                    } else {
                        Plotly.newPlot('chart-3d', [{ type: 'scatter3d', mode: 'markers', x: [1,2,3,4,5], y: [0.2,0.5,0.7,0.8,0.9], z: [100,200,300,400,500], marker: { color: [0.2,0.5,0.7,0.8,0.9], colorscale: 'RdYlGn', size: 4, opacity: 0.8 } }], { paper_bgcolor: 'transparent', scene: { bgcolor: 'transparent' }, margin: { t:0,r:0,b:0,l:0 }, font: { color: '#9ca3af', size: 9 } }, config)
                        Plotly.newPlot('chart-surface', [{ type: 'surface', colorscale: 'Viridis', z: [[0.1,0.3,0.5],[0.4,0.7,0.8],[0.6,0.8,0.95]] }], { paper_bgcolor: 'transparent', scene: { bgcolor: 'transparent' }, margin: { t:0,r:0,b:0,l:0 }, font: { color: '#9ca3af', size: 9 } }, config)
                    }
                },

                exportReport() {
                    const blob = new Blob([JSON.stringify(this.result, null, 2)], { type: 'application/json' })
                    const url  = URL.createObjectURL(blob)
                    const a    = document.createElement('a')
                    a.href = url; a.download = 'analysis-report.json'; a.click()
                    URL.revokeObjectURL(url)
                }
            }
        }
    </script>
